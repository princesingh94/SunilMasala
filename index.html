<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sunil Mehta Masala Shop – Fresh Stone-Ground Spices</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdf6e9;--card:#fff;--ink:#2b1b12;--muted:#7a6656;--line:#eadcc3;--saffron:#e8920c;--soft:#fdebc8;--red:#9b2c1c;--tile:#fff3da;--wa:#25D366;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#1c130d;--card:#2a1d14;--ink:#f8ecd8;--muted:#c2ab92;--line:#42301f;--saffron:#f2a626;--soft:#3c2a12;--red:#e0634d;--tile:#3a2814;color-scheme:dark}}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{background:var(--bg);color:var(--ink);font-family:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.5}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
.serif{font-family:'Playfair Display',Georgia,serif}
.muted{color:var(--muted)}.center{text-align:center}
.container{max-width:1100px;margin:0 auto;padding:0 16px}
.narrow{max-width:800px}.section{padding-top:40px;padding-bottom:20px}
h2{font-size:1.5rem;margin-bottom:12px}

/* header */
.header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:10px;padding-bottom:10px}
.brand{display:flex;align-items:center;gap:8px}
.brand b{display:block;font-size:.95rem;line-height:1.2}.brand small{font-size:.7rem;color:var(--muted)}
.logo{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--red);font-size:1.1rem}
.actions{display:flex;gap:6px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:99px;border:1px solid transparent;font:500 .85rem 'Poppins',sans-serif;cursor:pointer;transition:transform .15s,opacity .2s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.96)}
.btn-red{background:var(--red);color:#fff}.btn-green{background:var(--wa);color:#0b2e17}
.btn-saffron{background:var(--saffron);color:#2b1b12}
.btn-outline{border-color:var(--red);color:var(--red);background:transparent}
.btn-line{border-color:var(--line);background:var(--card);color:var(--ink);font-weight:600}
.big{padding:13px 28px;font-size:1rem}
@media(max-width:600px){.hide-sm{display:none}}

/* hero */
.hero{position:relative;overflow:hidden;background:var(--soft)}
.hero-in{position:relative;padding-top:64px;padding-bottom:64px}
.hero h1{font-size:clamp(1.9rem,6vw,3.2rem);line-height:1.15;max-width:680px;margin:14px auto}
.hero p{max-width:540px;margin:0 auto 26px}
.badge-city{display:inline-block;background:var(--card);color:var(--red);border-radius:99px;padding:4px 12px;font-size:.75rem;font-weight:500}
.fl{position:absolute;font-size:2rem;opacity:.5;animation:floaty 5s ease-in-out infinite;pointer-events:none}
@keyframes floaty{50%{transform:translateY(-14px) rotate(8deg)}}

/* steps */
.steps{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.step{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.step b{display:grid;place-items:center;flex:none;width:38px;height:38px;border-radius:50%;background:var(--red);color:#fff}
.step p{font-size:.875rem}

/* catalog */
.input{width:100%;padding:11px 16px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font:.9rem 'Poppins',sans-serif;outline:none}
.input:focus{border-color:var(--saffron)}
.search{border-radius:99px;background:var(--card);margin-bottom:12px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.pill{flex:none;white-space:nowrap;padding:8px 16px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:500 .85rem 'Poppins',sans-serif;cursor:pointer;transition:.2s}
.pill.active{background:var(--red);border-color:var(--red);color:#fff}
.pill.w{padding:6px 12px;font-size:.75rem}.pill.w.active{background:var(--saffron);border-color:var(--saffron);color:#2b1b12}
.grid{display:grid;gap:16px;margin-top:8px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(155,44,28,.15)}
.tile{display:grid;place-items:center;height:130px;background:var(--tile);font-size:3rem}
.tile span{transition:transform .3s}.card:hover .tile span{transform:scale(1.2) rotate(-8deg)}
.card-body{display:flex;flex-direction:column;gap:12px;padding:16px;flex:1}
.card h3{font-size:1rem;font-weight:600}.card h3 span{color:var(--muted);font-weight:400}
.wts{display:flex;flex-wrap:wrap;gap:8px}
.price{font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:700;color:var(--red)}
.price small{font:400 .8rem 'Poppins',sans-serif;color:var(--muted)}
.card-btns{display:flex;gap:8px;margin-top:auto}.card-btns .btn-red{flex:1}
.wa-icon{width:46px;padding:0}

/* trust */
.trust{background:var(--soft);margin-top:30px}
.trust-grid{display:grid;gap:24px;padding-top:40px;padding-bottom:40px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.trust-grid>div{display:flex;align-items:center;gap:12px}
.trust p{font-size:.85rem}
.ico{display:grid;place-items:center;flex:none;width:48px;height:48px;border-radius:50%;background:var(--card);font-size:1.4rem}

/* visit */
.visit{background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden}
.visit-head{background:var(--red);color:#fff;margin:0;padding:16px 24px;font-size:1.25rem}
.visit-body{display:grid;gap:24px;padding:24px;grid-template-columns:1fr auto;font-size:.9rem}
.visit ul{list-style:none;padding:0;display:grid;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.qr{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:160px;height:160px;margin:auto;border:2px dashed var(--line);border-radius:18px;text-align:center;color:var(--muted)}
.qr span{font-size:3rem;line-height:1}.qr small{font-size:.75rem}.qr b{color:var(--ink);font-size:.75rem}
@media(max-width:640px){.visit-body{grid-template-columns:1fr}}
.footer{text-align:center;font-size:.75rem;color:var(--muted);border-top:1px solid var(--line);padding:24px 0 90px;margin-top:30px}

/* cart */
.cart-fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;align-items:center;gap:8px;padding:13px 20px;border:0;border-radius:99px;background:var(--red);color:#fff;font:500 .95rem 'Poppins',sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.3);cursor:pointer}
.count{display:grid;place-items:center;min-width:24px;height:24px;padding:0 6px;border-radius:99px;background:var(--saffron);color:#2b1b12;font-size:.75rem;font-weight:700}
.count.pop{animation:pop .3s}@keyframes pop{50%{transform:scale(1.35)}}
.overlay{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.5)}
.drawer{position:fixed;z-index:40;right:0;bottom:0;width:100%;max-height:90vh;display:flex;flex-direction:column;background:var(--card);border-radius:24px 24px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.3);transform:translateY(100%);transition:transform .35s}
.drawer.open{transform:none}
@media(min-width:640px){.drawer{top:0;width:380px;max-height:none;border-radius:0;transform:translateX(100%)}}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.x{border:0;background:none;color:var(--ink);font-size:1.2rem;cursor:pointer;padding:6px}
.ship{padding:12px 16px 0;font-size:.75rem;color:var(--red);font-weight:500}
.bar-bg{height:8px;margin-top:4px;border-radius:99px;background:var(--tile);overflow:hidden}
.bar-fill{height:100%;background:var(--saffron);border-radius:99px;transition:width .4s}
.items{flex:1;overflow-y:auto;padding:16px;display:grid;gap:10px;align-content:start}
.item{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:10px}
.item>span{font-size:1.5rem}.item div{flex:1;min-width:0;font-size:.85rem;font-weight:500}
.item small{display:block;color:var(--muted);font-weight:400;font-size:.75rem}
.qty{display:flex;align-items:center;gap:8px;font-size:.85rem}
.qty button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.empty-cart{padding:40px 0;text-align:center;color:var(--muted);font-size:.9rem}
.drawer-foot{display:grid;gap:8px;padding:16px;border-top:1px solid var(--line);padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.total{display:flex;justify-content:space-between;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;padding:9px 20px;border-radius:99px;background:var(--ink);color:var(--bg);font-size:.85rem;opacity:0;transform:translate(-50%,20px);transition:.3s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* scroll reveal */
.reveal{opacity:0;transform:translateY(18px);transition:opacity .6s,transform .6s}.reveal.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
</style>
</head>
<body>

<header class="header">
  <div class="container bar">
    <a href="#top" class="brand">
      <span class="logo">🌶️</span>
      <span><b class="serif">Sunil Mehta Masala Shop</b><small>📍 <span class="cityTxt"></span></small></span>
    </a>
    <div class="actions">
      <button id="langBtn" class="btn btn-line">हिं</button>
      <a id="callBtn" class="btn btn-outline">📞 <span class="hide-sm" data-t="call"></span></a>
      <a id="waTop" target="_blank" rel="noopener" class="btn btn-green">💬 <span class="hide-sm">WhatsApp</span></a>
    </div>
  </div>
</header>

<main id="top">
  <section class="hero">
    <span class="fl" style="left:6%;top:18%">🌶️</span><span class="fl" style="right:8%;top:14%;animation-delay:1s">🌿</span>
    <span class="fl" style="left:12%;bottom:12%;animation-delay:2s">🟡</span><span class="fl" style="right:14%;bottom:16%;animation-delay:3s">🌰</span>
    <div class="container center hero-in">
      <span class="badge-city">📍 <span class="cityTxt"></span></span>
      <h1 class="serif" data-t="hero"></h1>
      <p class="muted" data-t="sub"></p>
      <a href="#catalog" class="btn btn-red big"><span data-t="browse"></span> ↓</a>
    </div>
  </section>

  <section class="container section">
    <h2 class="serif" data-t="how"></h2>
    <div class="steps">
      <div class="step reveal"><b>1</b><p data-t="s1"></p></div>
      <div class="step reveal"><b>2</b><p data-t="s2"></p></div>
      <div class="step reveal"><b>3</b><p data-t="s3"></p></div>
    </div>
  </section>

  <section id="catalog" class="container section">
    <h2 class="serif" data-t="ourm"></h2>
    <input id="q" type="search" class="input search" data-tp="search">
    <div id="tabs" class="tabs"></div>
    <div id="grid" class="grid"></div>
    <p id="empty" class="center muted" hidden data-t="empty"></p>
  </section>

  <section class="trust">
    <div class="container trust-grid">
      <div class="reveal"><span class="ico">🛡️</span><div><b data-t="t1"></b><p class="muted" data-t="t1d"></p></div></div>
      <div class="reveal"><span class="ico">🌾</span><div><b data-t="t2"></b><p class="muted" data-t="t2d"></p></div></div>
      <div class="reveal"><span class="ico">🚚</span><div><b data-t="t3"></b><p class="muted" data-t="t3d"></p></div></div>
    </div>
  </section>

  <section class="container section narrow">
    <div class="visit reveal">
      <h2 class="serif visit-head" data-t="visit"></h2>
      <div class="visit-body">
        <ul>
          <li>📍 <span id="address"></span></li>
          <li>🕐 <span id="hours"></span></li>
          <li>📞 <a id="phoneText"></a></li>
          <li class="row">
            <a id="mapBtn" target="_blank" rel="noopener" class="btn btn-saffron">🧭 <span data-t="dir"></span></a>
            <a id="waCard" target="_blank" rel="noopener" class="btn btn-green">💬 <span data-t="order"></span></a>
          </li>
        </ul>
        <a id="qrBox" target="_blank" rel="noopener" class="qr"><span>▦</span><small data-t="scan"></small><b id="waNumber"></b></a>
      </div>
    </div>
  </section>
</main>

<footer class="footer">© <span id="year"></span> Sunil Mehta Masala Shop ❤️</footer>

<button id="cartBtn" class="cart-fab" aria-label="Basket">🛒 <span data-t="cart"></span> <span id="badge" class="count">0</span></button>
<div id="ov" class="overlay" hidden></div>
<aside id="drawer" class="drawer">
  <div class="drawer-head"><h3 class="serif" data-t="yourcart"></h3><button id="closeCart" class="x" aria-label="Close">✕</button></div>
  <div id="ship" class="ship"></div>
  <div id="items" class="items"></div>
  <div class="drawer-foot">
    <input id="cname" class="input" data-tp="yname">
    <textarea id="caddr" rows="2" class="input" data-tp="yaddr"></textarea>
    <div class="total"><span data-t="total"></span><span id="total"></span></div>
    <a id="sendBtn" target="_blank" rel="noopener" class="btn btn-green big">📤 <span data-t="send"></span></a>
  </div>
</aside>
<div id="toast" class="toast"></div>

<script>
/* ===== 1. SHOP SETTINGS (edit here) ===== */
const SHOP = {
  name: "Sunil Mehta Masala Shop",
  city: "Gwalpara, Madhepura, Bihar",
  address: "Pirnagar, Gwalpara, Madhepura, Bihar – 852115",
  hours: "Mon–Sat: 8:00 AM – 9:00 PM · Sun: 9:00 AM – 2:00 PM",
  phone: "+91 81024 14871",
  whatsapp: "918102414871",            // country code + number, no + or spaces
  mapsUrl: "https://www.google.com/maps/search/?api=1&query=Pirnagar+Gwalpara+Madhepura+Bihar+852115",
  freeAbove: 500                       // free delivery above this amount (₹)
};

/* ===== 2. PRODUCTS (perKg = price in ₹ per kg) ===== */
const WEIGHTS = [{g:100,l:"100g"},{g:250,l:"250g"},{g:500,l:"500g"},{g:1000,l:"1kg"}];
const CATS = ["all","ground","whole","blend"];
const PRODUCTS = [
  {hi:"हल्दी",en:"Turmeric Powder",cat:"ground",perKg:240,e:"🟡"},
  {hi:"लाल मिर्च",en:"Red Chilli Powder",cat:"ground",perKg:360,e:"🌶️"},
  {hi:"धनिया",en:"Coriander Powder",cat:"ground",perKg:200,e:"🌿"},
  {hi:"जीरा",en:"Cumin Seeds",cat:"whole",perKg:420,e:"🌾"},
  {hi:"काली मिर्च",en:"Black Pepper",cat:"whole",perKg:900,e:"⚫"},
  {hi:"लौंग",en:"Cloves",cat:"whole",perKg:1100,e:"🌰"},
  {hi:"दालचीनी",en:"Cinnamon Sticks",cat:"whole",perKg:640,e:"🪵"},
  {hi:"बड़ी इलायची",en:"Black Cardamom",cat:"whole",perKg:1500,e:"🫘"},
  {hi:"गरम मसाला",en:"Garam Masala",cat:"blend",perKg:760,e:"🔥"},
  {hi:"बिरयानी मसाला",en:"Biryani Masala",cat:"blend",perKg:820,e:"🍛"},
  {hi:"मीट मसाला",en:"Meat Masala",cat:"blend",perKg:780,e:"🍖"}
];

/* ===== 3. LANGUAGE TEXT (English / हिन्दी) ===== */
const T = {
  en:{call:"Call Now",hero:"Pure, Fresh & Stone-Ground Spices Delivered to Your Doorstep",
    sub:"A name your neighbourhood has trusted for years. Rich aroma, true colour and zero adulteration — ground fresh and packed the same day.",
    browse:"Browse Masalas",how:"Order in 3 easy steps",s1:"Pick your masala and weight",s2:"Tap “Add” and open your basket",s3:"Send on WhatsApp — we confirm & deliver",
    ourm:"Our Masalas",search:"Search haldi, mirch, garam masala…",all:"All",ground:"Ground Masalas",whole:"Whole Spices",blend:"Special Blends",
    empty:"No masala found. Try another name!",add:"Add",for:"for",t1:"100% Pure & Fresh",t1d:"No colours, fillers or additives.",
    t2:"Traditional Stone-Ground",t2d:"Slow-ground to keep the aroma.",t3:"Same-Day Local Delivery",t3d:"Order in the morning, cook tonight.",
    visit:"Visit Our Shop",dir:"Get Directions",order:"Order on WhatsApp",scan:"Scan to order",cart:"Basket",yourcart:"Your Basket",
    yname:"Your name",yaddr:"Delivery address",total:"Total",send:"Send Order on WhatsApp",emptyCart:"Your basket is empty. Add some masala! 🌶️",
    added:"Added to basket ✓",free:"🎉 You get FREE delivery!",more:a=>`Add ₹${a} more for FREE delivery`,hi:"Hi",
    msgHead:"I want to order:",nm:"Name",ad:"Address",tot:"Total",lang:"हिं"},
  hi:{call:"कॉल करें",hero:"शुद्ध, ताज़े और सिल-बट्टे पर पिसे मसाले, सीधे आपके घर तक",
    sub:"सालों से आपके मोहल्ले का भरोसा। खुशबू, असली रंग और शून्य मिलावट — रोज़ ताज़ा पिसा और पैक।",
    browse:"मसाले देखें",how:"3 आसान कदमों में ऑर्डर करें",s1:"अपना मसाला और वज़न चुनें",s2:"“जोड़ें” दबाएँ और टोकरी खोलें",s3:"WhatsApp पर भेजें — हम पुष्टि कर घर पहुँचाएँगे",
    ourm:"हमारे मसाले",search:"हल्दी, मिर्च, गरम मसाला खोजें…",all:"सभी",ground:"पिसे मसाले",whole:"खड़े मसाले",blend:"ख़ास मिश्रण",
    empty:"कोई मसाला नहीं मिला। दूसरा नाम आज़माएँ!",add:"जोड़ें",for:"के लिए",t1:"100% शुद्ध और ताज़ा",t1d:"कोई रंग या मिलावट नहीं।",
    t2:"पारंपरिक सिल-बट्टे पर पिसा",t2d:"धीमी पिसाई, पूरी खुशबू।",t3:"उसी दिन लोकल डिलीवरी",t3d:"सुबह ऑर्डर करें, शाम को पकाएँ।",
    visit:"हमारी दुकान पर आइए",dir:"रास्ता देखें",order:"WhatsApp पर ऑर्डर",scan:"ऑर्डर के लिए स्कैन करें",cart:"टोकरी",yourcart:"आपकी टोकरी",
    yname:"आपका नाम",yaddr:"डिलीवरी का पता",total:"कुल",send:"WhatsApp पर ऑर्डर भेजें",emptyCart:"टोकरी खाली है। कुछ मसाले जोड़ें! 🌶️",
    added:"टोकरी में जुड़ गया ✓",free:"🎉 आपकी डिलीवरी फ्री है!",more:a=>`फ्री डिलीवरी के लिए ₹${a} और जोड़ें`,hi:"नमस्ते",
    msgHead:"मुझे ये ऑर्डर करना है:",nm:"नाम",ad:"पता",tot:"कुल",lang:"EN"}
};

/* ===== 4. HELPERS & STATE ===== */
const $ = id => document.getElementById(id);
const wa = text => `https://wa.me/${SHOP.whatsapp}?text=${encodeURIComponent(text)}`;
const price = (perKg, g) => Math.round((perKg * g / 1000) / 5) * 5;
const state = {cat:"all", q:"", lang:"en", sel:{}, cart:{}};
const L = () => T[state.lang];

try {                                   // restore saved basket & language
  const saved = JSON.parse(localStorage.getItem("smms") || "{}");
  if (saved.cart) state.cart = saved.cart;
  if (saved.lang) state.lang = saved.lang;
} catch (e) {}
const save = () => { try { localStorage.setItem("smms", JSON.stringify({cart:state.cart, lang:state.lang})); } catch (e) {} };

/* ===== 5. RENDER ===== */
function applyLang(){
  document.documentElement.lang = state.lang;
  document.querySelectorAll("[data-t]").forEach(el => { const v = L()[el.dataset.t]; if (typeof v === "string") el.textContent = v; });
  document.querySelectorAll("[data-tp]").forEach(el => el.placeholder = L()[el.dataset.tp]);
  $("langBtn").textContent = L().lang;
  renderTabs(); renderGrid(); renderCart();
}

function renderTabs(){
  $("tabs").innerHTML = CATS.map(c =>
    `<button class="pill ${state.cat===c?"active":""}" data-cat="${c}">${L()[c]}</button>`).join("");
}
